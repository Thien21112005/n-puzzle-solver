[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npuzzle"
version = "1.0.0"
description = "Sliding puzzle game with a visual comparison of search algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.scripts]
npuzzle = "npuzzle.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
